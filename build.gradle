plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		url "https://maven.nucleoid.xyz/"
		name "Nucleoid"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "Xander Maven"
		url = "https://maven.isxander.dev/releases"
	}

	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven { url 'https://maven.covers1624.net/' }
	maven {
		name = "FzzyMaven"
		url = uri("https://maven.fzzyhmstrs.me/")
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

loom {
	runs {
		clientLogin {
			client()
			ideConfigGenerated true
			programArgs '--launch_target', 'net.fabricmc.loader.impl.launch.knot.KnotClient'
			mainClass.set 'net.covers1624.devlogin.DevLogin'
		}
	}

	accessWidenerPath = file("src/main/resources/batoru.accesswidener")

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "maven.modrinth:rrv:${project.rrv_version}"

	implementation "maven.modrinth:mana-attributes:${project.mana_version}"
	implementation "maven.modrinth:resource-bar-api:${project.bar_api_version}"

	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	implementation include("eu.pb4:placeholder-api:${project.placeholder_api_version}")

	implementation "eu.pb4:trinkets:${trinkets_version}"

	implementation "me.fzzyhmstrs:fzzy_config:${fzzy_version}"

	localRuntime 'net.covers1624:DevLogin:0.1.0.5'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}